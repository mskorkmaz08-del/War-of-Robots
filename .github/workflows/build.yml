name: Build game

# Builds the game in the cloud on every push to main (and on demand):
#  - WebGL:   published to GitHub Pages, playable in any modern browser and
#             installable to the home screen (Android, iPhone, iPad, desktop)
#  - iOS:     an unsigned .ipa to install with Sideloadly (free Apple ID)
#  - Android: an .apk, attached to the "android-latest" release for a fixed download link
#
# Needs these repository secrets (Settings > Secrets and variables > Actions):
#   UNITY_LICENSE   contents of your Unity_lic.ulf file
#   UNITY_EMAIL     your Unity account email
#   UNITY_PASSWORD  your Unity account password
# And GitHub Pages set to "GitHub Actions" (Settings > Pages > Source).

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  UNITY_VERSION: 6000.0.47f1
  BUILD_METHOD: RobotArena.EditorTools.CIBuild.Build

jobs:
  check-secrets:
    name: Check Unity licence
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE || secrets.UNITY_LICENCE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          missing=""
          [ -z "$UNITY_LICENSE" ] && missing="$missing UNITY_LICENSE"
          [ -z "$UNITY_EMAIL" ] && missing="$missing UNITY_EMAIL"
          [ -z "$UNITY_PASSWORD" ] && missing="$missing UNITY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing. Add them under Settings > Secrets and variables > Actions > Repository secrets (not Variables, not Environment secrets)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "All Unity secrets found."
          echo "ready=true" >> "$GITHUB_OUTPUT"

  webgl:
    name: Build WebGL
    needs: check-secrets
    if: needs.check-secrets.outputs.ready == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-WebGL-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-WebGL-

      # The WebAssembly linker needs more memory than the runner has; extra swap stops it being killed.
      - name: Add swap for the WebGL linker
        run: |
          sudo fallocate -l 12G /mnt/extra.swap || sudo dd if=/dev/zero of=/mnt/extra.swap bs=1M count=12288
          sudo chmod 600 /mnt/extra.swap
          sudo mkswap /mnt/extra.swap
          sudo swapon /mnt/extra.swap
          free -h
          df -h / /mnt

      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE || secrets.UNITY_LICENCE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: WebGL
          buildMethod: ${{ env.BUILD_METHOD }}
          buildName: WarOfRobots

      # A new id for the offline cache, so installed copies switch to this build
      # in one piece the next time they start.
      - name: Stamp the offline cache with this build
        run: |
          id="${GITHUB_SHA::12}-${GITHUB_RUN_NUMBER}"
          sudo sed -i "s/__WOR_BUILD__/$id/" build/WebGL/WarOfRobots/sw.js
          grep -n "var BUILD" build/WebGL/WarOfRobots/sw.js

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/WebGL/WarOfRobots

  deploy-pages:
    name: Publish to GitHub Pages
    needs: webgl
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  ios-project:
    name: Export iOS project
    needs: check-secrets
    if: needs.check-secrets.outputs.ready == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-iOS-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-iOS-

      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE || secrets.UNITY_LICENCE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: iOS
          buildMethod: ${{ env.BUILD_METHOD }}
          buildName: WarOfRobots

      # tar keeps file permissions on the Xcode build scripts
      - name: Pack Xcode project
        run: sudo tar -czf ios-project.tar.gz -C build/iOS WarOfRobots

      - uses: actions/upload-artifact@v4
        with:
          name: ios-project
          path: ios-project.tar.gz
          retention-days: 3

  ios-ipa:
    name: Build iPhone app (.ipa)
    needs: ios-project
    runs-on: macos-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ios-project

      - name: Unpack Xcode project
        run: tar -xzf ios-project.tar.gz

      - name: Build unsigned app
        working-directory: WarOfRobots
        shell: bash
        run: |
          xcodebuild \
            -project Unity-iPhone.xcodeproj \
            -scheme Unity-iPhone \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ../dd \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tail -n 200

      - name: Package .ipa
        run: |
          APP=$(find dd/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -n 1)
          if [ -z "$APP" ]; then echo "::error::No .app produced"; exit 1; fi
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry WarOfRobots.ipa Payload
          ls -lh WarOfRobots.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: WarOfRobots-ipa
          path: WarOfRobots.ipa
          retention-days: 14

  android:
    name: Build Android app (.apk)
    needs: check-secrets
    if: needs.check-secrets.outputs.ready == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-Android-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-Android-

      # IL2CPP compiles the game for two phone chip types; extra swap keeps it from running out of memory.
      - name: Add swap for the IL2CPP compiler
        run: |
          sudo fallocate -l 8G /mnt/extra.swap || sudo dd if=/dev/zero of=/mnt/extra.swap bs=1M count=8192
          sudo chmod 600 /mnt/extra.swap
          sudo mkswap /mnt/extra.swap
          sudo swapon /mnt/extra.swap
          df -h / /mnt

      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE || secrets.UNITY_LICENCE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: Android
          buildMethod: ${{ env.BUILD_METHOD }}
          buildName: WarOfRobots
          versioning: None
          androidExportType: androidPackage
          androidVersionCode: ${{ github.run_number }}

      - name: Find the .apk
        run: |
          APK=$(sudo find build/Android -maxdepth 2 -name "*.apk" | head -n 1)
          if [ -z "$APK" ]; then echo "::error::No .apk produced"; exit 1; fi
          sudo cp "$APK" WarOfRobots.apk
          sudo chown "$(id -u)" WarOfRobots.apk
          ls -lh WarOfRobots.apk

      - uses: actions/upload-artifact@v4
        with:
          name: WarOfRobots-apk
          path: WarOfRobots.apk
          retention-days: 14

      # Same download link every time:
      # https://github.com/<owner>/<repo>/releases/download/android-latest/WarOfRobots.apk
      - name: Publish to the android-latest release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Android version of War of Robots, built from ${GITHUB_SHA::7} (build ${GITHUB_RUN_NUMBER}).
          Download WarOfRobots.apk on the phone, open it, and allow installing from this source when Android asks.
          New builds install over the old one and keep your progress."
          if ! gh release view android-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create android-latest --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "War of Robots for Android" --notes "$notes" --latest=false
          else
            gh release edit android-latest --repo "$GITHUB_REPOSITORY" --notes "$notes"
          fi
          gh release upload android-latest WarOfRobots.apk --repo "$GITHUB_REPOSITORY" --clobber
