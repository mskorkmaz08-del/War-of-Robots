<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a4350"/><stop offset="0.55" stop-color="#1d232b"/><stop offset="1" stop-color="#11151a"/>
    </linearGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c9d2dc"/><stop offset="0.5" stop-color="#7f8b98"/><stop offset="1" stop-color="#4a5460"/>
    </linearGradient>
    <linearGradient id="plateD" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a7b2be"/><stop offset="0.6" stop-color="#5d6874"/><stop offset="1" stop-color="#363e48"/>
    </linearGradient>
    <linearGradient id="visor" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0f6e66"/><stop offset="0.5" stop-color="#7ffff0"/><stop offset="1" stop-color="#0f6e66"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-200%" width="200%" height="500%"><feGaussianBlur stdDeviation="9"/></filter>
  </defs>
  <!-- chamfered shield -->
  <path d="M96 40 H416 L472 96 V300 L256 476 L40 300 V96 Z" fill="url(#steel)" stroke="#33d6c2" stroke-width="10" stroke-linejoin="miter"/>
  <path d="M110 64 H402 L448 110 V290 L256 446 L64 290 V110 Z" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="4"/>
  <!-- hazard ticks top -->
  <g fill="#33d6c2" opacity="0.9"><path d="M206 46 h26 l-12 14 h-26z"/><path d="M244 46 h26 l-12 14 h-26z"/><path d="M282 46 h26 l-12 14 h-26z"/></g>
  <!-- side fins -->
  <path d="M120 150 L172 126 L182 250 L132 288 Z" fill="url(#plateD)"/>
  <path d="M392 150 L340 126 L330 250 L380 288 Z" fill="url(#plate)"/>
  <!-- helmet crown -->
  <path d="M176 112 L256 86 L336 112 L350 200 H162 Z" fill="url(#plate)"/>
  <path d="M256 86 L256 200 H162 L176 112 Z" fill="url(#plateD)" opacity="0.55"/>
  <path d="M244 92 H268 V196 H244 Z" fill="#1a1f26" opacity="0.65"/>
  <!-- visor band -->
  <path d="M150 204 H362 L350 250 H162 Z" fill="#0b0e12"/>
  <path d="M172 218 H340 L334 236 H178 Z" fill="#33d6c2" filter="url(#glow)" opacity="0.9"/>
  <path d="M172 218 H340 L334 236 H178 Z" fill="url(#visor)"/>
  <!-- jaw -->
  <path d="M166 256 H346 L320 330 L256 358 L192 330 Z" fill="url(#plateD)"/>
  <path d="M256 256 H346 L320 330 L256 358 Z" fill="url(#plate)" opacity="0.5"/>
  <g fill="#0b0e12"><rect x="206" y="276" width="14" height="44"/><rect x="230" y="276" width="14" height="52"/><rect x="268" y="276" width="14" height="52"/><rect x="292" y="276" width="14" height="44"/></g>
  <!-- bolts -->
  <g fill="#1a1f26"><circle cx="190" cy="134" r="6"/><circle cx="322" cy="134" r="6"/><circle cx="182" cy="268" r="5"/><circle cx="330" cy="268" r="5"/></g>
  <!-- crossed chevrons below -->
  <path d="M176 372 L256 420 L336 372 L336 394 L256 442 L176 394 Z" fill="#33d6c2" opacity="0.85"/>
</svg>
