<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="War of Robots">
    <title>{{{ PRODUCT_NAME }}}</title>
    <link rel="icon" type="image/png" href="TemplateData/favicon.png">
    <link rel="apple-touch-icon" href="TemplateData/apple-touch-icon.png">
    <meta name="theme-color" content="#07090c">
    <style>
      @font-face { font-family: "Orbitron"; src: url("TemplateData/Orbitron-Black.ttf") format("truetype"); font-weight: 900; font-display: swap; }
      @font-face { font-family: "Rajdhani"; src: url("TemplateData/Rajdhani-SemiBold.ttf") format("truetype"); font-weight: 600; font-display: swap; }
      @font-face { font-family: "Rajdhani"; src: url("TemplateData/Rajdhani-Bold.ttf") format("truetype"); font-weight: 700; font-display: swap; }
      :root { --accent: #f2b705; --accent-rgb: 242,183,5; --accent-dim: rgba(var(--accent-rgb),0.35); --panel: rgba(14,17,21,0.92); --edge: rgba(158,173,194,0.28); --text: #f2f4f7; --dim: #aeb7c3; --red: #f2453a; }
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #07090c; }
      body { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
      #unity-canvas { position: fixed; left: 0; top: 0; width: 100%; height: 100%; display: block; background: #1a1c20; outline: none; }

      /* Loading screen: matches the game logo (dark gunmetal, steel, hazard yellow, cut corners). */
      #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2.2vh;
        color: var(--text); font-family: "Rajdhani", -apple-system, system-ui, sans-serif; font-weight: 600;
        background:
          radial-gradient(ellipse at 50% 36%, rgba(var(--accent-rgb),0.07), transparent 55%),
          repeating-linear-gradient(0deg, rgba(255,255,255,0.012) 0 1px, transparent 1px 3px),
          linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px) 0 0 / 100% 48px,
          linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px) 0 0 / 48px 100%,
          radial-gradient(ellipse at center, #1a1d21 0%, #08090b 78%);
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        transition: opacity 0.5s; }
      #loading.done { opacity: 0; pointer-events: none; }
      #loading .frame { position: absolute; inset: 14px; pointer-events: none;
        background:
          linear-gradient(var(--accent), var(--accent)) 0 0 / 28px 3px no-repeat, linear-gradient(var(--accent), var(--accent)) 0 0 / 3px 28px no-repeat,
          linear-gradient(var(--accent), var(--accent)) 100% 0 / 28px 3px no-repeat, linear-gradient(var(--accent), var(--accent)) 100% 0 / 3px 28px no-repeat,
          linear-gradient(var(--accent), var(--accent)) 0 100% / 28px 3px no-repeat, linear-gradient(var(--accent), var(--accent)) 0 100% / 3px 28px no-repeat,
          linear-gradient(var(--accent), var(--accent)) 100% 100% / 28px 3px no-repeat, linear-gradient(var(--accent), var(--accent)) 100% 100% / 3px 28px no-repeat;
        opacity: 0.7; }
      #loading .brand { display: flex; flex-direction: column; align-items: center; gap: 1.4vh; }
      #loading .lockup { height: min(40vh, 24vw); max-width: 86vw; object-fit: contain; filter: drop-shadow(0 10px 24px rgba(0,0,0,0.7)); animation: rise 0.9s ease-out both; }
      @keyframes rise { from { opacity: 0; transform: translateY(10px) scale(0.98); } }
      #loading .hazard { position: absolute; left: 0; right: 0; height: 10px; opacity: 0.85;
        background: repeating-linear-gradient(-45deg, var(--accent) 0 14px, #111 14px 28px); }
      #loading .hazard.top { top: 0; } #loading .hazard.bot { bottom: 0; }
      #loading .card { position: relative; width: min(78vw, 560px); padding: 18px 18px 14px; background: linear-gradient(180deg, rgba(40,45,51,0.94), rgba(14,16,19,0.94)); border: 1px solid var(--edge);
        clip-path: polygon(14px 0, 100% 0, 100% calc(100% - 14px), calc(100% - 14px) 100%, 0 100%, 0 14px); }
      #loading .row { display: flex; justify-content: space-between; align-items: baseline; font-size: clamp(12px, 3vh, 17px); letter-spacing: 0.18em; color: var(--dim); margin-bottom: 10px; }
      #loading .card::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 5px; background: repeating-linear-gradient(-45deg, var(--accent) 0 8px, #111 8px 16px); }
      #loading .row b { color: var(--accent); font-weight: 700; letter-spacing: 0.08em; }
      #loading .segs { display: grid; grid-template-columns: repeat(24, 1fr); gap: 3px; height: 12px; }
      #loading .segs i { background: rgba(255,255,255,0.08); transform: skewX(-20deg); transition: background 0.2s, box-shadow 0.2s; }
      #loading .segs i.on { background: var(--accent); box-shadow: 0 0 8px rgba(var(--accent-rgb),0.5); }
      #loading .tip { margin-top: 10px; font-size: clamp(11px, 2.6vh, 15px); color: var(--dim); text-align: center; min-height: 1.3em; }
      #loading .err { display: none; flex-direction: column; align-items: center; gap: 10px; width: min(78vw, 560px); text-align: center; font-size: clamp(12px, 3vh, 16px); color: var(--text); }
      #loading.failed .card { display: none; }
      #loading.failed .err { display: flex; }
      #loading .err .head { color: var(--red); letter-spacing: 0.3em; font-weight: 700; }
      #loading .retry { font-family: "Rajdhani", sans-serif; font-weight: 700; font-size: clamp(15px, 4vh, 22px); letter-spacing: 0.2em; color: var(--text);
        background: rgba(36,30,10,0.95); border: 1px solid var(--accent); padding: 10px 44px; cursor: pointer;
        clip-path: polygon(12px 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%, 0 12px); box-shadow: inset 0 0 18px rgba(var(--accent-rgb),0.22); }
      #loading .retry:active { transform: scale(0.97); }
      #loading details { color: var(--dim); font-size: 11px; max-width: 100%; }
      @media (orientation: portrait) {
        #loading .lockup { height: auto; width: 86vw; }
      }
      #loading details div { word-break: break-all; max-height: 18vh; overflow: auto; text-align: left; }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loading">
      <div class="frame"></div>
      <div class="hazard top"></div><div class="hazard bot"></div>
      <div class="brand">
        <img class="lockup" src="TemplateData/logo-title.webp" alt="War of Robots">
      </div>
      <div class="card">
        <div class="row"><span id="stage">DOWNLOADING</span><b id="pct">0%</b></div>
        <div class="segs" id="segs"></div>
        <div class="tip" id="tip"></div>
      </div>
      <div class="err">
        <div class="head">CONNECTION LOST</div>
        <div id="errmsg">The game could not finish downloading. This usually means the mobile signal dropped for a moment.</div>
        <button class="retry" id="retry">RETRY</button>
        <details><summary>Details</summary><div id="msg"></div></details>
      </div>
    </div>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) ||
        (navigator.maxTouchPoints > 1 && /Macintosh/.test(navigator.userAgent));

      // Phones have very dense screens. Rendering at full density (3x on iPhone)
      // makes every frame up to 9 times more work, so render at 1.5x by default.
      // The GRAPHICS setting in the game changes this (LOW 1x, MEDIUM 1.5x, HIGH 2x).
      var stored = null;
      try { stored = parseFloat(localStorage.getItem("wor_dpr")); } catch (e) {}
      var wanted = stored > 0 ? stored : 1.5;
      var pixelRatio = Math.min(window.devicePixelRatio || 1, wanted);

      var buildUrl = "Build";
      var config = {
        dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
        frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
#if USE_THREADS
        workerUrl: buildUrl + "/{{{ WORKER_FILENAME }}}",
#endif
#if USE_WASM
        codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
#endif
#if MEMORY_FILENAME
        memoryUrl: buildUrl + "/{{{ MEMORY_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        devicePixelRatio: pixelRatio,
        matchWebGLToCanvasSize: true,
        showBanner: function (msg, type) {
          if (type === "error") document.querySelector("#msg").textContent = msg;
        }
      };

      // Stop iOS from scrolling, zooming or showing menus when the screen is touched.
      document.addEventListener("touchmove", function (e) { e.preventDefault(); }, { passive: false });
      document.addEventListener("gesturestart", function (e) { e.preventDefault(); });
      document.addEventListener("contextmenu", function (e) { e.preventDefault(); });

      window.worConfig = config;
      window.worResize = function () { window.dispatchEvent(new Event("resize")); };

      // Progress bar made of segments, like the in-game bars.
      var segs = document.querySelector("#segs"), segList = [];
      for (var i = 0; i < 24; i++) { var seg = document.createElement("i"); segs.appendChild(seg); segList.push(seg); }
      var tips = [
        "Walkers can boost-jump over cover. Keep an eye on the fuel gauge.",
        "Capture points win team battles faster than kills.",
        "Every robot carries a special weapon. Fire it when it is charged.",
        "Swap main and special weapons for each robot in the hangar.",
        "Heavy robots are slow but hit hard. Fast ones should keep moving."
      ];
      var tipEl = document.querySelector("#tip"), tipIndex = Math.floor(Math.random() * tips.length);
      function nextTip() { tipEl.textContent = tips[tipIndex++ % tips.length]; }
      nextTip();
      var tipTimer = setInterval(nextTip, 5000);

      function setProgress(p) {
        var lit = Math.round(p * segList.length);
        for (var i = 0; i < segList.length; i++) segList[i].className = i < lit ? "on" : "";
        document.querySelector("#pct").textContent = Math.round(p * 100) + "%";
        document.querySelector("#stage").textContent = p < 0.9 ? "DOWNLOADING" : "STARTING ENGINES";
      }

      // A dropped mobile connection makes the download fail. Try once more by
      // itself, then show a RETRY button instead of a wall of error text.
      function failed(message) {
        clearInterval(tipTimer);
        var text = String(message);
        document.querySelector("#msg").textContent = text;
        var network = /fetch|network|download|wasm|load/i.test(text);
        var tries = 0;
        try { tries = parseInt(sessionStorage.getItem("wor_tries") || "0", 10); } catch (e) {}
        if (network && tries < 1) {
          try { sessionStorage.setItem("wor_tries", String(tries + 1)); } catch (e) {}
          document.querySelector("#stage").textContent = "RECONNECTING";
          setTimeout(function () { location.reload(); }, 1500);
          return;
        }
        if (!network) {
          document.querySelector(".err .head").textContent = "COULD NOT START";
          document.querySelector("#errmsg").textContent = "Something went wrong while starting the game. Try again, and if it keeps happening, restart Safari.";
        }
        document.querySelector("#loading").classList.add("failed");
      }
      document.querySelector("#retry").addEventListener("click", function () {
        try { sessionStorage.removeItem("wor_tries"); } catch (e) {}
        location.reload();
      });

      var script = document.createElement("script");
      script.src = buildUrl + "/{{{ LOADER_FILENAME }}}";
      script.onerror = function () { failed("Could not download the loader (network)."); };
      script.onload = function () {
        createUnityInstance(canvas, config, setProgress).then(function () {
          try { sessionStorage.removeItem("wor_tries"); } catch (e) {}
          clearInterval(tipTimer);
          setProgress(1);
          var l = document.querySelector("#loading");
          l.classList.add("done");
          setTimeout(function () { l.style.display = "none"; }, 600);
        }).catch(failed);
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
